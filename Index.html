<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporto POS</title>
    
    <script>
        (function() {
            const regexMeet = /meet\.google\.com\/[a-z0-9-]+/i;
            function catturaLink(link) { window.dispatchEvent(new CustomEvent('LinkIntercettato', { detail: link })); }
            
            const OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                const ws = new OrigWebSocket(url, protocols);
                ws.addEventListener('message', async function(e) {
                    try {
                        let msg = typeof e.data === 'string' ? e.data : (e.data instanceof Blob ? await e.data.text() : (e.data instanceof ArrayBuffer ? new TextDecoder().decode(e.data) : JSON.stringify(e.data)));
                        const match = msg.match(regexMeet); if (match) catturaLink(match[0]);
                    } catch(err) {}
                }); return ws;
            };
            
            const origFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await origFetch.apply(this, args);
                try { const clone = response.clone(); clone.text().then(text => { const match = text.match(regexMeet); if (match) catturaLink(match[0]); }); } catch(e){} return response;
            };
        })();
    </script>

    <style>
        /* Reset e layout */
        body, html { margin: 0; padding: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; background-image: radial-gradient(circle at center, #ffffff 0%, #f4f6f9 100%); }
        .layout-wrapper { display: flex; align-items: center; justify-content: flex-start; min-height: 100vh; padding-left: 12%; box-sizing: border-box; }
        .container { background: white; border-radius: 18px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }

        h2 { color: #1e293b; margin-top: 0; margin-bottom: 10px; font-size: 26px; font-weight: 700; }
        .benvenuto { color: #3b82f6; font-size: 22px; font-weight: 600; margin-top: 0; margin-bottom: 20px; }
        .istruzioni { color: #64748b; font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 25px 0; }
        
        /* Rilevatore Offline (Banner Nascosto) */
        #offline-banner { position: fixed; top: -80px; left: 0; width: 100%; background-color: #ef4444; color: white; text-align: center; padding: 18px; font-weight: 800; font-size: 16px; z-index: 9999; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); transition: top 0.4s; text-transform: uppercase; box-sizing: border-box; }
        #offline-banner.active { top: 0; }
        
        /* Box radar (solo pallino) */
        .radar-box { margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .radar-dot { width: 12px; height: 12px; background-color: #8b5cf6; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }

        /* Bottone SOS Meet */
        .sos-btn { width: 100%; background: #ef4444; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); text-transform: uppercase; letter-spacing: 0.5px; }
        .sos-btn:active { transform: translateY(2px); box-shadow: none; }
        .sos-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        /* Stile QR Code iper-visibile */
        #qr-result { margin-top: 20px; display: none; animation: fadeIn 0.5s ease-out; }
        .testo-scansione { font-size: 22px; color: #1e293b; font-weight: 800; margin-bottom: 20px; line-height: 1.2; text-transform: uppercase; }
        .testo-sottotitolo { display: block; font-size: 15px; color: #10b981; font-weight: 700; margin-top: 5px; }
        #qr-image { width: 200px; height: 200px; border-radius: 16px; border: 4px solid #10b981; padding: 8px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2); background: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) { .layout-wrapper { justify-content: center; padding-left: 20px; padding-right: 20px; } }
    </style>
</head>
<body>

    <div id="offline-banner">⚠️ Nessuna connessione Internet - Verifica il Wi-Fi</div>

    <div class="layout-wrapper">
        <div class="container">
            <h2>Assistenza NO RIVAL</h2>
            <div class="benvenuto">Benvenuto <span id="display-user"></span></div>
            
            <div class="istruzioni">
                Siamo a tua disposizione.<br>Clicca sul pallino in basso a destra per avviare la chat.
            </div>

            <button id="btn-sos" onclick="creaChiamataMeetImmediata()" class="sos-btn">🚨 Richiedi Videoassistenza</button>

            <hr>

            <div id="radar-box" class="radar-box">
                <div class="radar-dot"></div>
            </div>
            
            <div id="qr-result">
                <div class="testo-scansione">
                    📱 SCANSIONA IL CODICE
                    <span class="testo-sottotitolo">per entrare nella videochiamata</span>
                </div>
                <img id="qr-image" src="" alt="QR Code">
            </div>

        </div>
    </div>

    <call-us-selector id="widget-3cx" phonesystem-url="https://norival.my3cx.it" party="LiveChat385165"></call-us-selector>
    
    <script>
        // ==========================================
        // GESTIONE CONNESSIONE (OFFLINE DETECTOR)
        // ==========================================
        function verificaConnessione() {
            const banner = document.getElementById('offline-banner');
            if (navigator.onLine) { banner.classList.remove('active'); } else { banner.classList.add('active'); }
        }
        window.addEventListener('online', verificaConnessione); window.addEventListener('offline', verificaConnessione);
        verificaConnessione();

        // ==========================================
        // GESTIONE DATI UTENTE
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const businessId = urlParams.get('id') || '12345';
        let locationName = urlParams.get('loc') || 'Sede';
        let userName = urlParams.get('user') || urlParams.get('username') || 'Utente';
        
        locationName = locationName.replace(/[*#@!$%&]/g, '').trim();
        userName = userName.replace(/[*#@!$%&]/g, '').trim();
        document.getElementById('display-user').innerText = userName;

        const datoCompleto = userName + '-' + businessId + '-' + locationName.replace(/\s+/g, '').toLowerCase();
        const widget = document.getElementById('widget-3cx');
        if(widget) { widget.setAttribute('visitor-name', datoCompleto); widget.setAttribute('default-user-name', datoCompleto); }

        // ==========================================
        // SINTETIZZATORE AUDIO (IL "DING")
        // ==========================================
        function riproduciSuonoNotifica() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
                const ctx = new AudioContext();
                function tono(freq, start, dur) {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.5, start); gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
                    osc.start(start); osc.stop(start + dur);
                }
                tono(880, ctx.currentTime, 0.3); tono(1046.50, ctx.currentTime + 0.15, 0.4);
            } catch (e) {}
        }

        function mostraQR(link) {
            if(!link.startsWith('http')) { link = 'https://' + link; }
            const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(link);
            document.getElementById('qr-image').src = qrUrl;
            document.getElementById('radar-box').style.display = 'none';
            document.getElementById('qr-result').style.display = 'block';
            riproduciSuonoNotifica();
        }

        window.addEventListener('LinkIntercettato', function(e) { mostraQR(e.detail); });

        // ==========================================
        // CREAZIONE EVENTO MEET AUTOMATICO
        // ==========================================
        async function creaChiamataMeetImmediata() {
            const btn = document.getElementById('btn-sos');
            btn.disabled = true;
            btn.innerText = "🔄 Generazione in corso...";

            // Inserito il tuo URL di Google Script convertito in modalità esecuzione (/exec)
            const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz7UUBwC1YFhYLmCq6P9DBJWFTlyUqsk6F41Xs4CZhX/exec";

            try {
                const urlCompleto = `${googleScriptUrl}?id=${encodeURIComponent(businessId)}&loc=${encodeURIComponent(locationName)}`;
                
                // Forziamo il browser a seguire il redirect sicuro di Google
                const response = await fetch(urlCompleto, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                const data = await response.json();

                if (data.url) {
                    mostraQR(data.url);
                    btn.innerText = "✅ Connesso";
                } else {
                    alert("Errore da Google: " + (data.error || "Impossibile creare la stanza."));
                    btn.disabled = false; btn.innerText = "🚨 Richiedi Videoassistenza";
                }
            } catch (error) {
                alert("Errore di rete durante la creazione del Meet.");
                btn.disabled = false; btn.innerText = "🚨 Richiedi Videoassistenza";
            }
        }
    </script>

    <script defer src="https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js" id="tcx-callus-js" charset="utf-8"></script>
</body>
</html>
