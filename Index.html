<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporto POS</title>
    
    <script>
        (function() {
            const regexMeet = /meet\.google\.com\/[a-z0-9-]+/i;

            function catturaLink(link) {
                window.dispatchEvent(new CustomEvent('LinkIntercettato', { detail: link }));
            }

            // 1. Intercettiamo le WebSocket
            const OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                const ws = new OrigWebSocket(url, protocols);
                ws.addEventListener('message', async function(e) {
                    try {
                        let msg = "";
                        if (typeof e.data === 'string') {
                            msg = e.data;
                        } else if (e.data instanceof Blob) {
                            msg = await e.data.text();
                        } else if (e.data instanceof ArrayBuffer) {
                            msg = new TextDecoder().decode(e.data);
                        } else {
                            msg = JSON.stringify(e.data);
                        }
                        
                        const match = msg.match(regexMeet);
                        if (match) catturaLink(match[0]);
                    } catch(err) {}
                });
                return ws;
            };

            // 2. Intercettiamo le chiamate Fetch
            const origFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await origFetch.apply(this, args);
                try {
                    const clone = response.clone();
                    clone.text().then(text => {
                        const match = text.match(regexMeet);
                        if (match) catturaLink(match[0]);
                    }).catch(e=>{});
                } catch(err) {}
                return response;
            };

            // 3. Intercettiamo le chiamate AJAX
            const origOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function() {
                this.addEventListener('load', function() {
                    try {
                        const match = this.responseText.match(regexMeet);
                        if (match) catturaLink(match[0]);
                    } catch(err) {}
                });
                origOpen.apply(this, arguments);
            };

            // 4. Intercettiamo i Server-Sent Events
            if (window.EventSource) {
                const OrigEventSource = window.EventSource;
                window.EventSource = function(url, config) {
                    const es = new OrigEventSource(url, config);
                    es.addEventListener('message', function(e) {
                        try {
                            if (typeof e.data === 'string') {
                                const match = e.data.match(regexMeet);
                                if (match) catturaLink(match[0]);
                            }
                        } catch(err) {}
                    });
                    return es;
                };
            }
        })();
    </script>

    <style>
        /* Reset e layout */
        body, html { margin: 0; padding: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; background-image: radial-gradient(circle at center, #ffffff 0%, #f4f6f9 100%); }
        .layout-wrapper { display: flex; align-items: center; justify-content: flex-start; min-height: 100vh; padding-left: 12%; box-sizing: border-box; }
        .container { background: white; border-radius: 18px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }

        h2 { color: #1e293b; margin-top: 0; margin-bottom: 10px; font-size: 26px; font-weight: 700; }
        .benvenuto { color: #3b82f6; font-size: 22px; font-weight: 600; margin-top: 0; margin-bottom: 20px; }
        .istruzioni { color: #64748b; font-size: 16px; line-height: 1.5; }

        hr { border: 0; height: 1px; background: #e2e8f0; margin: 30px 0; }
        
        /* Rilevatore Offline (Banner Nascosto) */
        #offline-banner {
            position: fixed;
            top: -80px; /* Nascosto fuori dallo schermo in alto */
            left: 0;
            width: 100%;
            background-color: #ef4444; /* Rosso allarme */
            color: white;
            text-align: center;
            padding: 18px;
            font-weight: 800;
            font-size: 16px;
            z-index: 9999;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-sizing: border-box;
        }
        
        /* Classe per farlo scendere visibilmente */
        #offline-banner.active {
            top: 0; 
        }

        /* Box radar (solo pallino) */
        .radar-box { margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .radar-dot { width: 12px; height: 12px; background-color: #8b5cf6; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }

        /* Stile per il QR Code iper-visibile */
        #qr-result { margin-top: 20px; display: none; animation: fadeIn 0.5s ease-out; }
        
        .testo-scansione { font-size: 24px; color: #1e293b; font-weight: 800; margin-bottom: 20px; line-height: 1.2; text-transform: uppercase; }
        .testo-sottotitolo { display: block; font-size: 16px; color: #10b981; font-weight: 700; margin-top: 5px; }

        #qr-image { width: 200px; height: 200px; border-radius: 16px; border: 4px solid #10b981; padding: 8px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2); background: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) { .layout-wrapper { justify-content: center; padding-left: 20px; padding-right: 20px; } }
    </style>
</head>

    <script>
        // ==========================================
        // GESTIONE CONNESSIONE (OFFLINE DETECTOR)
        // ==========================================
        function verificaConnessione() {
            const banner = document.getElementById('offline-banner');
            if (navigator.onLine) {
                // Online: Nascondi il banner
                banner.classList.remove('active');
            } else {
                // Offline: Mostra il banner
                banner.classList.add('active');
            }
        }

        // Ascoltiamo i cambiamenti di rete del tablet
        window.addEventListener('online', verificaConnessione);
        window.addEventListener('offline', verificaConnessione);
        
        // Controllo immediato all'apertura della pagina
        verificaConnessione();

        // ==========================================
        // GESTIONE DATI UTENTE
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const businessId = urlParams.get('id') || '12345';
        let locationName = urlParams.get('loc') || 'sede';
        let userName = urlParams.get('user') || urlParams.get('username') || 'Utente';
        
        locationName = locationName.replace(/[*#@!$%&]/g, '');
        userName = userName.replace(/[*#@!$%&]/g, '');
        document.getElementById('display-user').innerText = userName.trim();

        const locationFormattata = locationName.trim();
        const userFormattato = userName.trim(); 
        const datoCompleto = userFormattato + '-' + businessId + '-' + locationFormattata;

        const widget = document.getElementById('widget-3cx');
        if(widget) {
            widget.setAttribute('visitor-name', datoCompleto);
            widget.setAttribute('default-user-name', datoCompleto);
        }

        // ==========================================
        // SINTETIZZATORE AUDIO (IL "DING")
        // ==========================================
        function riproduciSuonoNotifica() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                function riproduciTono(frequenza, inizio, durata) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequenza, inizio);
                    
                    gain.gain.setValueAtTime(0.5, inizio);
                    gain.gain.exponentialRampToValueAtTime(0.01, inizio + durata);
                    
                    osc.start(inizio);
                    osc.stop(inizio + durata);
                }

                const adesso = ctx.currentTime;
                riproduciTono(880, adesso, 0.3);         
                riproduciTono(1046.50, adesso + 0.15, 0.4); 
            } catch (e) {
                console.log("Audio non supportato");
            }
        }

        // ==========================================
        // GESTIONE DEL QR CODE AUTOMATICO
        // ==========================================
        function mostraQR(link) {
            if(!link.startsWith('http://') && !link.startsWith('https://')) { link = 'https://' + link; }
            const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(link);
            
            document.getElementById('qr-image').src = qrUrl;
            document.getElementById('radar-box').style.display = 'none';
            document.getElementById('qr-result').style.display = 'block';
            
            riproduciSuonoNotifica();
        }

        window.addEventListener('LinkIntercettato', function(e) {
            mostraQR(e.detail);
        });
    </script>
