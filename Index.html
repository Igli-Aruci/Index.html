<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Servizio Premium</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 10px;
        }
        p {
            color: #86868b;
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background: #0071e3;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            border: none;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #e8e8ed;
            color: #0071e3;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0071e3;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">⚠️</div>
    <h1>Servizio Premium non attivo</h1>
    <p>Il servizio di abbonamento per questo dispositivo risulta scaduto o non ancora attivato. Rinnova per sbloccare le funzionalità.</p>
    
    <a href="https://buy.stripe.com/tuo_link_stripe" class="btn">Attiva Servizio Premium</a>
    
    <button id="checkBtn" class="btn btn-secondary">🔄 Ho già pagato, verifica</button>
    
    <div id="loader" class="loader"></div>
</div>

<script>
    // Copia qui l'URL esatto fornito da Google Script dopo aver fatto la "Nuova Versione"
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbx43TEA06gLbc1Slue4siu_4_xmsvsAEYlZ69oTYnmad0zNlVKJj837Lm_lTMr-RxvXiw/exec";

    // Estrae automaticamente i parametri dall'iPad
    const urlParams = new URLSearchParams(window.location.search);
    const businessId = urlParams.get('id') || '';
    const locationId = urlParams.get('loc') || '';

    $('#checkBtn').on('click', function() {
        $('#loader').show();
        $('#checkBtn').prop('disabled', true);

        // Chiamata AJAX configurata in JSONP
        $.ajax({
            url: googleScriptUrl,
            dataType: "jsonp",
            data: {
                id: businessId,
                loc: locationId,
                action: "check"
            },
            success: function(response) {
                $('#loader').hide();
                $('#checkBtn').prop('disabled', false);

                if (response.status === "ATTIVO") {
                    alert("Servizio Attivo! Il dispositivo verrà sbloccato.");
                    window.location.href = "https://tuosito.com/home"; // Cambia con la tua home reale
                } else if (response.status.startsWith("AVVISO")) {
                    alert("Abbonamento in scadenza. Servizio temporaneamente attivo.");
                    window.location.href = "https://tuosito.com/home"; // Cambia con la tua home reale
                } else {
                    alert("Il servizio risulta ancora non attivo. Controlla il pagamento o riprova tra pochi minuti.");
                }
            },
            error: function() {
                $('#loader').hide();
                $('#checkBtn').prop('disabled', false);
                alert("Errore di connessione durante la verifica. Riprova.");
            }
        });
    });
</script>

</body>
</html>
