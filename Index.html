<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistenza SOS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #1c1c1e;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #3a3a3c;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .btn-sos {
            background-color: #ff3b30;
            color: #ffffff;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 59, 48, 0.3);
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
        }
        .btn-sos:active {
            transform: scale(0.95);
            background-color: #d7261e;
        }
        .loading {
            display: none;
            margin-top: 20px;
            font-size: 16px;
            color: #8e8e93;
        }
        .error-banner {
            display: none;
            margin-top: 20px;
            background-color: #ffe5e5;
            color: #ff3b30;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #ff3b30;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">Videoassistenza SOS</h1>
    <p id="description">In caso di blocco del servizio o anomalie gravi, premi il pulsante per avviare una chiamata video con un tecnico.</p>
    <button class="btn-sos" id="sos-button" onclick="startSOS()">🚨 SOS</button>
    <div class="loading" id="loading">Creazione stanza Meet in corso...</div>
    <div class="error-banner" id="error-banner"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const businessId = urlParams.get('id');
    const locationId = urlParams.get('loc');
    const locationName = urlParams.get('loc_name') || "Sede";
    const lang = urlParams.get('lang') || 'it';

    if (lang === 'en') {
        document.getElementById('title').innerText = 'SOS Video Support';
        document.getElementById('description').innerText = 'In case of service block or serious issues, press the button to start a video call with a technician.';
        document.getElementById('loading').innerText = 'Creating Meet room...';
    }

    // Sostituisci questa stringa con il tuo URL /exec corrente di Google Apps Script
    const webAppUrl = "https://script.google.com/macros/s/AKfycbx43TEA06gLbc1Slue4siu_4_xmsvsAEYlZ69oTYnmad0zNlVKJj837Lm_lTMr-RxvXiw/exec";

    function startSOS() {
        if (!businessId) {
            showError(lang === 'en' ? 'Error: Missing Business ID' : 'Errore: ID Business mancante');
            return;
        }

        document.getElementById('sos-button').disabled = true;
        document.getElementById('loading').style.display = 'block';
        document.getElementById('error-banner').style.display = 'none';

        const targetUrl = `${webAppUrl}?action=sos&id=${encodeURIComponent(businessId)}&loc=${encodeURIComponent(locationId)}&loc_name=${encodeURIComponent(locationName)}&lang=${lang}`;

        fetch(targetUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('sos-button').disabled = false;

                if (data.status === 'ATTIVO' && data.url) {
                    window.location.href = data.url;
                } else if (data.status === 'SCADUTO') {
                    window.location.href = 'https://buy.stripe.com/tuo_link_di_pagamento_reale';
                } else {
                    showError(data.error || (lang === 'en' ? 'Server error creating Meet.' : 'Errore server creazione Meet.'));
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('sos-button').disabled = false;
                showError(lang === 'en' ? 'Connection error.' : 'Errore di connessione.');
            });
    }

    function showError(msg) {
        const banner = document.getElementById('error-banner');
        banner.innerText = msg;
        banner.style.display = 'block';
    }
</script>

</body>
</html>
