<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interfaccia Assistenza SOS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-sos { background-color: #ff3b30; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(255,59,48,0.3); transition: all 0.2s; }
        .btn-sos:active { transform: scale(0.98); background-color: #e03228; }
        .banner { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .banner.error { display: block; background-color: #ffe5e5; color: #ff3b30; border: 1px solid #ff3b30; }
        .banner.success { display: block; background-color: #e4fbf0; color: #34c759; border: 1px solid #34c759; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #ff3b30; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Assistenza Tecnica Remota</h2>
    <p>In caso di anomalie gravi al punto cassa, premi il pulsante sotto per avviare una videochiamata con un tecnico.</p>
    
    <button class="btn-sos" id="sosBtn" onclick="inviaRichiestaSOS()">🚨 ATTIVA CHIAMATA SOS</button>
    
    <div class="loader" id="loader"></div>
    <div id="statusBanner" class="banner"></div>
</div>

<script>
    // Configura qui i parametri fissi del tablet o estraili dinamicamente dall'URL
    const urlParams = new URLSearchParams(window.location.search);
    const BUSINESS_ID = urlParams.get('id') || "12345"; // Inserisci qui l'ID predefinito se necessario
    const LOCATION_ID = urlParams.get('loc') || "67890";
    const LOCATION_NAME = urlParams.get('loc_name') || "Sede Principale";
    
    // Incolla qui il tuo URL di Apps Script /exec
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx43TEA06gLbc1Slue4siu_4_xmsvsAEYlZ69oTYnmad0zNlVKJj837Lm_lTMr-RxvXiw/exec";

    function inviaRichiestaSOS() {
        const btn = document.getElementById('sosBtn');
        const loader = document.getElementById('loader');
        const banner = document.getElementById('statusBanner');
        
        btn.disabled = true;
        loader.style.display = 'block';
        banner.className = 'banner';
        banner.style.display = 'none';

        // Costruiamo la richiesta con il bypass callback per evitare blocchi CORS sull'iPad
        const targetUrl = `${SCRIPT_URL}?action=sos&id=${encodeURIComponent(BUSINESS_ID)}&loc=${encodeURIComponent(LOCATION_ID)}&loc_name=${encodeURIComponent(LOCATION_NAME)}&callback=gestisciRisposta`;

        // Rimuove vecchi script di chiamata se presenti
        const vecchioScript = document.getElementById('jsonpCall');
        if (vecchioScript) vecchioScript.remove();

        // Iniezione dinamica dello script (Metodo JSONP super sicuro per tablet)
        const script = document.createElement('script');
        script.id = 'jsonpCall';
        script.src = targetUrl;
        script.onerror = function() {
            mostraErrore("Impossibile contattare il server cloud. Controlla la connessione internet.");
        };
        
        document.body.appendChild(script);
    }

    // Questa funzione viene attivata direttamente dalla risposta del server di Google
    function gestisciRisposta(data) {
        const btn = document.getElementById('sosBtn');
        const loader = document.getElementById('loader');
        const banner = document.getElementById('statusBanner');
        
        btn.disabled = false;
        loader.style.display = 'none';

        if (data && data.status === "ATTIVO" && data.url) {
            banner.className = "banner success";
            banner.innerHTML = "Stanza Meet Creata! Apertura in corso...";
            banner.style.display = 'block';
            
            // Reindirizza l'iPad direttamente dentro la stanza di Google Meet
            setTimeout(() => {
                window.location.href = data.url;
            }, 1000);
        } else {
            mostraErrore(data.error || "Errore sconosciuto durante la creazione del link Meet.");
        }
    }

    function mostraErrore(messaggio) {
        const btn = document.getElementById('sosBtn');
        const loader = document.getElementById('loader');
        const banner = document.getElementById('statusBanner');
        
        btn.disabled = false;
        loader.style.display = 'none';
        banner.className = "banner error";
        banner.innerHTML = `⚠️ Errore server: ${messaggio}`;
        banner.style.display = 'block';
    }
</script>
</body>
</html>
